<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoClick — Escaparate</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>TecnoClick</h1>
        <p class="contador-carrito">Carrito: 0 productos</p>
    </header>

    <main class="escaparate">
        <section class="catalogo">
            <h2>Catálogo</h2>
            <div class="productos">
                <article class="producto">
                    <h3>Ratón inalámbrico</h3>
                    <p class="precio">19,99 €</p>
                    <p class="stock">12 unidades</p>
                    <button>Añadir al carrito</button>
                </article>
                <article class="producto">
                    <h3>Teclado mecánico</h3>
                    <p class="precio">45,50 €</p>
                    <p class="stock">5 unidades</p>
                    <button>Añadir al carrito</button>
                </article>
                <article class="producto">
                    <h3>Auriculares con micro</h3>
                    <p class="precio">29,90 €</p>
                    <p class="stock">10 unidades</p>
                    <button>Añadir al carrito</button>
                </article>
            </div>
        </section>

        <aside class="carrito">
            <h2>Tu carrito</h2>
            <p>Todavía no has añadido ningún producto.</p>
        </aside>
    </main>

    <footer>
        <p>Proyecto del módulo DWEC</p>
    </footer>
</body>
</html>
